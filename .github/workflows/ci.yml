# PhishGuard — CI Pipeline
# Runs on every push and pull request

name: PhishGuard CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend + Parity Tests ────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (needed for feature-parity tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install ml-training dependencies
        run: |
          cd ml-training
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

      - name: Run feature-parity tests
        # These fail hard if Node is present but the JS harness is broken —
        # that is intentional.  A skip means Node is not available; a
        # failure means Python and JavaScript disagree.
        run: |
          cd backend
          pytest ../tests/test_feature_parity.py -v --tb=short

  # ── Extension Lint ───────────────────────────────────────
  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          python -c "
          import json
          with open('extension/manifest.json') as f:
              m = json.load(f)
          assert m['manifest_version'] == 3
          assert 'service_worker' in m['background']
          print('manifest.json is valid MV3')
          "

      - name: Check JS syntax
        run: |
          node --check extension/background/service-worker.js
          node --check extension/content/content-script.js
          node --check extension/popup/popup.js
          node --check extension/options/options.js
